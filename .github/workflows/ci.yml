name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt pytest ruff

      - name: Lint
        run: ruff check _SMART_VAC_CLEANER.py test_cleaner.py

      - name: Tests
        run: pytest -q
