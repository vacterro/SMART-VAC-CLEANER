name: Build EXE

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt pytest ruff pyinstaller

      - name: Lint (CORE-013: release prerequisite)
        run: ruff check _SMART_VAC_CLEANER.py test_cleaner.py

      - name: Tests (CORE-013: release prerequisite)
        run: pytest -q

      - name: Package smoke (CORE-013: release prerequisite)
        run: python test_package_install.py

      - name: Version equality check (CORE-013)
        run: |
          $pyproject_ver = (Select-String -Path pyproject.toml -Pattern '^version = ').Line.Split('"')[1]
          $script_ver = (Select-String -Path _SMART_VAC_CLEANER.py -Pattern '^VERSION = ').Line.Split('"')[1]
          $tag_ver = $env:GITHUB_REF.Substring(10)
          Write-Host "pyproject=$pyproject_ver script=$script_ver tag=$tag_ver"
          if ($pyproject_ver -ne $script_ver) { throw "pyproject.version != VERSION" }
          if ($tag_ver -ne "v$pyproject_ver") { throw "tag != v{pyproject.version}: tag=$tag_ver expected=v$pyproject_ver" }

      - name: Build exe
        run: |
          python -m PyInstaller --onefile --console --clean --noconfirm --name SmartVACCleaner --collect-data customtkinter --add-data "strings;strings" _SMART_VAC_CLEANER.py

      - name: Smoke test
        run: |
          .\dist\SmartVACCleaner.exe --status | Select-Object -First 2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVACCleaner
          path: dist/SmartVACCleaner.exe

      # T-143: a v* tag is a RELEASE only when the exe actually lands on the
      # GitHub Release page -- never leave "Grab it from Releases" pointing at
      # an Actions artifact.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/SmartVACCleaner.exe `
            --title "Smart VAC Cleaner ${{ github.ref_name }}" `
            --notes "Portable SmartVACCleaner.exe build (no installer)."
