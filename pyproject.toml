[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-vac-cleaner"
version = "2.6.0"
description = "Portable, safe, modern junk cleaner for Windows: system junk, app caches, portable roots, custom rules. GUI + CLI + Task Scheduler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vacterro" }]
keywords = ["cleaner", "junk", "cache", "portable", "windows", "maintenance"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "customtkinter>=5.2",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.scripts]
vac-cleaner = "_SMART_VAC_CLEANER:main"

[tool.setuptools]
py-modules = ["_SMART_VAC_CLEANER"]
